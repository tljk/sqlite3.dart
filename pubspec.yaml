name: _
publish_to: none

environment:
  sdk: ^3.6.0

dependencies:
  path: ^1.9.1
  crypto: ^3.0.6
  collection: ^1.19.1
  file: ^7.0.1
  pool: ^1.5.2
  hooks: ^2.0.0

dependency_overrides:
  code_assets:
    git:
      url: https://gitcode.com/CPF-Flutter/fluttertpc_dart_native.git
      path: pkgs/code_assets
      ref: flutter_3.47.7_deps
  hooks:
    git:
      url: https://gitcode.com/openharmony-sig/fluttertpc_dart_native.git
      path: pkgs/hooks
      ref: flutter_3.47.7_deps
  native_toolchain_c:
    git:
      url: https://gitcode.com/hxa-flutter/native_toolchain_c.git
      ref: main

workspace:
  - sqlite3
  - sqlite3/example/custom_extension
  - sqlite3_connection_pool
  - sqlite3_web
  - sqlite3_test
  - native_tests

  - legacy/sqlcipher_flutter_libs
  - legacy/sqlite3_flutter_libs
